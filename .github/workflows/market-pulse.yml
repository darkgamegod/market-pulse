# Runs Market Pulse in the cloud every ~15 min and publishes docs/ via GitHub Pages.
# Setup (later): push repo, Settings > Pages > "Deploy from branch" main /docs,
# Settings > Actions > General > Workflow permissions: Read and write.
name: market-pulse
on:
  schedule:
    - cron: "*/15 * * * *"      # GitHub may delay scheduled runs at busy times
  workflow_dispatch: {}
concurrency: { group: market-pulse, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Watch cycle (rebuilds daily report automatically on a new ET day)
        env: { TZ: America/New_York }
        run: python run.py --once
      - name: Commit updated dashboard
        run: |
          git config user.name "market-pulse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Market Pulse update $(date -u +%FT%TZ)"
          git pull --rebase -X ours || true
          git push
